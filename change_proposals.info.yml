name: 'Change Proposals'
type: module
description: 'Content changes proposed by AI agents, integrations or contributors are stored as proposals; an editor reviews the diff and approves or rejects. Approval applies the change as a new revision with a full audit trail.'
package: 'AI'
core_version_requirement: ^10.3 || ^11
php: 8.3
dependencies:
  - drupal:user
  - drupal:field
  - drupal:options
configure: change_proposals.settings
